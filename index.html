<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TT Desk">
<title>temptingtatts desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="lock" class="lock">
  <img src="icons/icon-192.png" alt="" width="64" height="64">
  <h1>temptingtatts desk</h1>
  <form id="unlockForm" autocomplete="off">
    <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button type="submit">Unlock</button>
    <p id="lockMsg" class="muted"></p>
  </form>
</section>

<main id="app" hidden>
  <header class="top">
    <div><strong>temptingtatts</strong> <span id="asOf" class="muted small"></span></div>
    <button id="lockBtn" class="ghost small" title="Lock">Lock</button>
  </header>
  <div id="view"></div>
  <nav class="tabs">
    <button data-tab="money" class="on">Money</button>
    <button data-tab="appts">Appts</button>
    <button data-tab="spend">Spend</button>
    <button data-tab="todo">To-do</button>
  </nav>
</main>
<script src="app.js"></script>
</body>
</html>
